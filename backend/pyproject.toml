[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexiclear-backend"
version = "1.0.0"
description = "LexiClear Backend - AI-powered Contract Analysis, Compliance, Risk, and Negotiation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "celery[redis]>=5.3.6",
    "redis>=5.0.3",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.5",
    "boto3>=1.34.60",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",
    "networkx>=3.2.1",
    "jinja2>=3.1.3",
    "python-docx>=1.1.0",
    "pypdfium2>=4.28.0",
    "anthropic>=0.19.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.99.0",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F401", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
